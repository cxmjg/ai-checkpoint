[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bib-timing"
version = "0.1.0"
description = "Detección local de dorsales y registro de tiempos en línea de meta"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ultralytics>=8.3.0",
  "opencv-python-headless>=4.10.0",
  "numpy>=1.26.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
ocr = ["easyocr>=1.7.0"]
web = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0.0"]

[project.scripts]
bib-timing = "bib_timing.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bib_timing = ["web/static/*"]
